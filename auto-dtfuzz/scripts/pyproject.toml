[project]
name = "auto-dtfuzz"
version = "0.5.0"
description = "Coverage-guided libFuzzer campaigns for message-entry modules"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dtfuzz = "dtfuzz.cli:main"

[tool.setuptools]
